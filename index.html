<style>
/* ════════════════════════════════════════════════════════════
   DESIGN TOKENS
   ════════════════════════════════════════════════════════════ */
:root{
  --paper:#FAFAF7;
  --paper2:#F2F1EC;
  --ink:#17171c;
  --ink-soft:#5c5c66;
  --rule:#dcdbd4;
  --red:#B3382C;
  --blue:#1F4E79;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Source Serif 4',serif;background:var(--paper);color:var(--ink);line-height:1.6}
::selection{background:var(--red);color:#fff}
.display{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:-0.03em}

/* ── nav ── */
nav{position:fixed;top:0;left:0;right:0;z-index:50;
  background:rgba(250,250,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule)}
.nav-inner{max-width:1100px;margin:0 auto;padding:14px 28px;
  display:flex;justify-content:space-between;align-items:center}
.nav-name{font-family:'Archivo',sans-serif;font-weight:700;font-size:.95rem}
.nav-name::after{content:'·';color:var(--red);margin-left:4px}
.nav-links{display:flex;gap:26px}
.nav-links a{font-family:'IBM Plex Mono',monospace;font-size:.76rem;
  color:var(--ink-soft);text-decoration:none;text-transform:lowercase;transition:color .15s}
.nav-links a:hover{color:var(--ink)}

/* ── layout ── */
.wrap{max-width:1100px;margin:0 auto;padding:0 28px}
section{padding:90px 0;border-bottom:1px solid var(--rule)}
section:last-of-type{border-bottom:none}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.72rem;
  color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;gap:12px}
.eyebrow b{color:var(--red);font-weight:500}
.sec-title{font-size:clamp(1.7rem,3vw,2.3rem);margin-bottom:36px;line-height:1.15}

/* ════════ HERO ════════ */
#hero{padding:150px 0 70px;border-bottom:1px solid var(--rule)}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
.hero-status{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-soft);
  display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;
  border:1px solid var(--rule);padding:6px 12px;border-radius:3px;background:#fff}
.hero-status::before{content:'';width:7px;height:7px;border-radius:50%;background:#2e9e44}
h1{font-size:clamp(2.6rem,4.6vw,3.8rem);line-height:1.04;margin-bottom:20px}
h1 em{font-style:normal;color:var(--red)}
.hero-role{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--blue);
  margin-bottom:22px;letter-spacing:.02em}
.hero-desc{font-size:1.04rem;color:var(--ink-soft);max-width:430px;margin-bottom:34px}
.hero-desc strong{color:var(--ink);font-weight:500}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:'Archivo',sans-serif;font-weight:600;font-size:.88rem;
  text-decoration:none;padding:12px 22px;border-radius:3px;
  transition:transform .15s, box-shadow .15s;display:inline-block}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{transform:translateY(-1px);box-shadow:3px 3px 0 var(--red)}
.btn-line{border:1px solid var(--ink);color:var(--ink)}
.btn-line:hover{transform:translateY(-1px);box-shadow:3px 3px 0 var(--blue)}

/* graph panel */
.graph-panel{border:1px solid var(--ink);border-radius:4px;background:#fff;
  overflow:hidden;box-shadow:6px 6px 0 var(--paper2)}
.graph-head{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-soft)}
.graph-legend{display:flex;gap:14px}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lg.r i{background:var(--red)}
.lg.s i{background:#fff;border:2px solid var(--red)}
.lg.b i{background:var(--blue)}
#pgraph{display:block;width:100%;height:460px}
.graph-foot{padding:8px 14px;border-top:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft)}

/* ════════ ABOUT ════════ */
.about-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:56px}
.about-body p{margin-bottom:18px;color:var(--ink-soft);font-size:1.03rem}
.about-body p:first-child::first-letter{font-family:'Archivo',sans-serif;font-weight:800;
  font-size:3.1em;float:left;line-height:.85;margin:4px 10px 0 0;color:var(--red)}
.about-body strong{color:var(--ink);font-weight:500}
.contact-list{list-style:none;border-top:2px solid var(--ink)}
.contact-list li{border-bottom:1px solid var(--rule)}
.contact-list a{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 2px;text-decoration:none;transition:padding-left .15s}
.contact-list a:hover{padding-left:10px}
.c-name{font-family:'Archivo',sans-serif;font-weight:600;font-size:.9rem;color:var(--ink)}
.c-handle{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-soft)}

/* ════════ RESEARCH ════════ */
.res-card{border:1px solid var(--ink);border-radius:4px;background:#fff;
  padding:34px;margin-bottom:22px;display:grid;grid-template-columns:130px 1fr;gap:30px}
.res-status{font-family:'IBM Plex Mono',monospace;font-size:.7rem;line-height:1.55;color:var(--red)}
.res-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.3rem;margin-bottom:4px}
.res-sub{font-size:.88rem;color:var(--red);font-style:italic;margin-bottom:14px}
.res-desc{font-size:.94rem;color:var(--ink-soft);margin-bottom:16px}
.res-paper{font-size:.84rem;color:var(--ink-soft);border-left:2px solid var(--rule);
  padding-left:12px;margin-bottom:16px}
.res-paper .venue{font-style:italic}
.res-stats{font-family:'IBM Plex Mono',monospace;font-size:.73rem;color:var(--ink);
  display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:16px}
.res-stats b{color:var(--red);font-weight:500}
.res-links{display:flex;gap:18px}

/* ════════ PROJECTS ════════ */
.subdomain{margin-bottom:40px}
.subdomain-head{font-family:'IBM Plex Mono',monospace;font-size:.78rem;
  color:var(--blue);text-transform:uppercase;letter-spacing:.1em;
  padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:0;
  display:flex;justify-content:space-between;align-items:baseline}
.subdomain-count{color:var(--ink-soft);font-size:.7rem}
.proj{display:grid;grid-template-columns:90px 1fr;gap:28px;
  padding:24px 2px;border-bottom:1px solid var(--rule)}
.proj-num{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-soft);padding-top:3px}
.proj-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:4px}
.proj-sub{font-size:.85rem;color:var(--red);font-style:italic;margin-bottom:10px}
.proj-desc{font-size:.92rem;color:var(--ink-soft);margin-bottom:14px}
.proj-stats{font-family:'IBM Plex Mono',monospace;font-size:.73rem;color:var(--ink);
  display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px}
.proj-stats b{color:var(--blue);font-weight:500}
.proj-links{display:flex;gap:18px}
.plink{font-family:'Archivo',sans-serif;font-weight:600;font-size:.8rem;
  color:var(--ink);text-decoration:none;border-bottom:2px solid var(--rule);
  padding-bottom:2px;transition:border-color .15s}
.plink:hover{border-color:var(--red)}
.subdomain-empty{font-family:'IBM Plex Mono',monospace;font-size:.74rem;
  color:var(--ink-soft);padding:18px 2px;border-bottom:1px solid var(--rule)}

/* ════════ SKILLS ════════ */
.skill-rows{border-top:2px solid var(--ink)}
.skill-row{display:grid;grid-template-columns:220px 1fr;gap:24px;
  padding:18px 2px;border-bottom:1px solid var(--rule);align-items:baseline}
.skill-cat{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.08em}
.skill-list{font-size:.95rem}
.skill-list span:not(:last-child)::after{content:' · ';color:var(--rule)}

/* ════════ READING ════════ */
.reading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px;margin-top:10px}
.reading-cat-head{font-family:'IBM Plex Mono',monospace;font-size:.78rem;
  color:var(--blue);text-transform:uppercase;letter-spacing:.1em;
  padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:0;
  display:flex;justify-content:space-between;align-items:baseline}
.reading-count{color:var(--ink-soft);font-size:.7rem}
.reading-book{padding:11px 2px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.book-t{font-size:.9rem;color:var(--ink)}
.book-t.active{color:var(--red)}
.book-a{font-family:'IBM Plex Mono',monospace;font-size:.7rem;
  color:var(--ink-soft);text-align:right;flex-shrink:0;max-width:140px}

/* ── footer ── */
footer{padding:36px 0;border-top:1px solid var(--rule)}
.foot{display:flex;justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-soft)}

/* ════════ CONTACT ════════ */
.contact-box{border:1px solid var(--ink);border-radius:4px;background:#fff;
  box-shadow:6px 6px 0 var(--paper2);padding:44px;text-align:center}
.contact-line{font-size:1.05rem;color:var(--ink-soft);margin-bottom:22px}
.contact-email{font-family:'Archivo',sans-serif;font-weight:700;
  font-size:clamp(1.3rem,3vw,2rem);letter-spacing:-.01em;
  color:var(--ink);text-decoration:none;border-bottom:3px solid var(--red);
  transition:color .15s}
.contact-email:hover{color:var(--red)}
.contact-actions{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#copy-email{cursor:pointer;background:none}

/* ════════ MINI GAME ════════ */
.game-panel{border:1px solid var(--ink);border-radius:4px;background:#fff;
  overflow:hidden;box-shadow:6px 6px 0 var(--paper2)}
.game-head{display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-soft)}
.game-hud{display:flex;gap:18px}
.game-hud b{color:var(--ink);font-weight:500}
#gamecanvas{display:block;width:100%;height:380px;cursor:crosshair}
.game-foot{padding:8px 14px;border-top:1px solid var(--rule);
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft);
  display:flex;justify-content:space-between;align-items:center}
#game-restart{font-family:'Archivo',sans-serif;font-weight:600;font-size:.74rem;
  border:1px solid var(--ink);background:#fff;color:var(--ink);
  padding:4px 12px;border-radius:3px;cursor:pointer;transition:box-shadow .15s}
#game-restart:hover{box-shadow:2px 2px 0 var(--red)}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}

@media(max-width:880px){
  .hero-grid,.about-cols{grid-template-columns:1fr}
  .res-card,.proj{grid-template-columns:1fr;gap:10px}
  .skill-row{grid-template-columns:1fr;gap:6px}
  #pgraph{height:380px}
  .reading-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  .reveal{transition:none;opacity:1;transform:none}
}
</style>

/* ╔══════════════════════════════════════════════════════════════╗
   ║  PERSONAL GRAPH — force layout from DATA.graph_tree.          ║
   ╚══════════════════════════════════════════════════════════════╝ */
(function(){
  const canvas = document.getElementById('pgraph');
  const ctx = canvas.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const RED  = css.getPropertyValue('--red').trim();
  const BLUE = css.getPropertyValue('--blue').trim();
  const INK  = '#17171c';

  let W, H, DPR;
  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(); addEventListener('resize', resize);

  const nodes = [], edges = [];
  (function walk(t, parentIdx){
    const idx = nodes.length;
    nodes.push({
      label: t.label, type: t.type,
      x: W*0.5 + (Math.random()-0.5)*W*0.6,
      y: H*0.5 + (Math.random()-0.5)*H*0.6,
      vx:0, vy:0,
      r: t.type==='me' ? 12 : t.type==='cat' ? 8 : t.type==='sub' ? 7 : 5.5
    });
    if(parentIdx !== null) edges.push({a:nodes[parentIdx], b:nodes[idx]});
    (t.children||[]).forEach(c=>walk(c, idx));
  })(DATA.graph_tree, null);
  nodes[0].x = W/2; nodes[0].y = H/2;

  let drag=null, hover=null;
  function pick(x,y){
    for(const n of nodes){
      const dx=n.x-x, dy=n.y-y;
      if(dx*dx+dy*dy < 18*18) return n;
    }
    return null;
  }
  function evtPos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  canvas.addEventListener('mousedown', e=>{ const p=evtPos(e); drag=pick(p.x,p.y); });
  canvas.addEventListener('touchstart', e=>{ const p=evtPos(e); drag=pick(p.x,p.y); if(drag) e.preventDefault(); }, {passive:false});
  addEventListener('mouseup', ()=>drag=null);
  addEventListener('touchend', ()=>drag=null);
  canvas.addEventListener('mousemove', e=>{
    const p=evtPos(e);
    if(drag){ drag.x=p.x; drag.y=p.y; drag.vx=drag.vy=0; }
    else hover = pick(p.x,p.y);
    canvas.style.cursor = (drag||hover) ? 'grab' : 'default';
  });
  canvas.addEventListener('touchmove', e=>{
    const p=evtPos(e);
    if(drag){ drag.x=p.x; drag.y=p.y; e.preventDefault(); }
  }, {passive:false});
  canvas.addEventListener('mouseleave', ()=>hover=null);

  function step(){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let d2=dx*dx+dy*dy || 1;
        if(d2 < 190*190){
          const d=Math.sqrt(d2), f=1000/d2;
          dx/=d; dy/=d;
          a.vx-=dx*f; a.vy-=dy*f;
          b.vx+=dx*f; b.vy+=dy*f;
        }
      }
    }
    for(const e of edges){
      let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-105)*0.00006*d;
      dx/=d; dy/=d;
      e.a.vx+=dx*f; e.a.vy+=dy*f;
      e.b.vx-=dx*f; e.b.vy-=dy*f;
    }
    for(const n of nodes){
      const pull = n.type==='me' ? 0.012 : 0.0007;
      n.vx += (W/2-n.x)*pull;
      n.vy += (H/2-n.y)*pull;
      n.vx*=0.85; n.vy*=0.85;
      if(n!==drag){ n.x+=n.vx; n.y+=n.vy; }
      n.x=Math.max(24,Math.min(W-24,n.x));
      n.y=Math.max(24,Math.min(H-24,n.y));
    }
  }

  function neighbours(n){
    const set = new Set([n]);
    edges.forEach(e=>{ if(e.a===n) set.add(e.b); if(e.b===n) set.add(e.a); });
    return set;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const focus = hover||drag;
    const nb = focus ? neighbours(focus) : null;

    for(const e of edges){
      const active = focus && (e.a===focus||e.b===focus);
      ctx.strokeStyle = active ? INK : '#cfcec7';
      ctx.lineWidth = active ? 1.6 : 1;
      ctx.beginPath();
      ctx.moveTo(e.a.x,e.a.y);
      ctx.lineTo(e.b.x,e.b.y);
      ctx.stroke();
    }
    for(const n of nodes){
      const dim = nb && !nb.has(n);
      ctx.globalAlpha = dim ? 0.22 : 1;
      if(n.type==='sub'){
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fill();
        ctx.strokeStyle = RED; ctx.lineWidth=2; ctx.stroke();
      } else {
        ctx.fillStyle = n.type==='me' ? INK : n.type==='cat' ? RED : BLUE;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
      }
      ctx.font = n.type==='me'
        ? '700 12px "Archivo", sans-serif'
        : n.type==='cat'
          ? '500 11px "IBM Plex Mono", monospace'
          : '400 10.5px "IBM Plex Mono", monospace';
      ctx.fillStyle = dim ? '#b6b5ae' : INK;
      ctx.fillText(n.label, n.x+n.r+5, n.y+4);
      ctx.globalAlpha = 1;
    }
  }

  (function loop(){ step(); draw(); requestAnimationFrame(loop); })();
})();

/* ╔══════════════════════════════════════════════════════════════╗
   ║  MINI GAME — "Bridge the Gap"                                  ║
   ╚══════════════════════════════════════════════════════════════╝ */
(function(){
  const GAME = {
    duration: 30,
    nodeCount: 7,
    philWords: ["Anumana","Maya","Vyapti","Dialectic","Pramana","Tarka","Ahimsa","Upamana","Shabda","Arthapatti"],
    aiWords:   ["RAG","LoRA","Bayes","Attention","Embedding","SPARQL","Gradient","Token","Reward","Inference"]
  };

  const canvas = document.getElementById('gamecanvas');
  const ctx = canvas.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const RED  = css.getPropertyValue('--red').trim();
  const BLUE = css.getPropertyValue('--blue').trim();
  const INK  = '#17171c';

  const elScore = document.getElementById('g-score');
  const elTime  = document.getElementById('g-time');
  const elBest  = document.getElementById('g-best');

  let W,H,DPR;
  function resize(){
    DPR = Math.min(devicePixelRatio||1,2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize(); addEventListener('resize', resize);

  let orbs=[], bridges=[], picked=null, score=0, timeLeft=GAME.duration,
      running=false, started=false, timerId=null, flash=0;
  let best = 0;

  function randWord(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function spawnOrb(type){
    return {
      type,
      label: randWord(type==='phil' ? GAME.philWords : GAME.aiWords),
      x: 40+Math.random()*(W-80),
      y: 40+Math.random()*(H-80),
      vx:(Math.random()-0.5)*1.1,
      vy:(Math.random()-0.5)*1.1,
      r: 11, pop: 0
    };
  }

  function reset(){
    orbs=[]; bridges=[]; picked=null; score=0; timeLeft=GAME.duration; flash=0;
    for(let i=0;i<GAME.nodeCount;i++){ orbs.push(spawnOrb('phil')); orbs.push(spawnOrb('ai')); }
    elScore.textContent=0; elTime.textContent=GAME.duration;
    running=true; started=true;
    clearInterval(timerId);
    timerId = setInterval(()=>{
      timeLeft--;
      elTime.textContent = timeLeft;
      if(timeLeft<=0){
        running=false; clearInterval(timerId);
        best = Math.max(best, score);
        elBest.textContent = best;
      }
    },1000);
  }

  document.getElementById('game-restart').addEventListener('click', reset);

  canvas.addEventListener('click', e=>{
    if(!started){ reset(); return; }
    if(!running){ reset(); return; }
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    let hit=null;
    for(const o of orbs){
      const dx=o.x-x, dy=o.y-y;
      if(dx*dx+dy*dy < (o.r+8)*(o.r+8)){ hit=o; break; }
    }
    if(!hit) return;
    if(!picked){ picked=hit; return; }
    if(hit===picked){ picked=null; return; }
    if(hit.type===picked.type){
      flash = 8;
      picked = null;
      return;
    }
    bridges.push({x1:picked.x,y1:picked.y,x2:hit.x,y2:hit.y,life:40});
    picked.pop = 1; hit.pop = 1;
    score++; elScore.textContent = score;
    picked=null;
  });

  function step(){
    for(const o of orbs){
      if(o.pop>0){
        o.pop+=0.12;
        if(o.pop>=2){ Object.assign(o, spawnOrb(o.type)); }
        continue;
      }
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<26||o.x>W-26) o.vx*=-1;
      if(o.y<26||o.y>H-26) o.vy*=-1;
    }
    bridges = bridges.filter(b=>--b.life>0);
    if(flash>0) flash--;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(flash>0){ ctx.fillStyle='rgba(179,56,44,0.08)'; ctx.fillRect(0,0,W,H); }

    for(const b of bridges){
      ctx.globalAlpha = Math.min(1, b.life/20);
      ctx.strokeStyle = INK; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.font='400 10px "IBM Plex Mono", monospace';
    ctx.textAlign='center';
    for(const o of orbs){
      const scale = o.pop>0 ? Math.max(0, 1-(o.pop-1)) : 1;
      const rr = o.r*scale;
      if(rr<=0.5) continue;
      ctx.fillStyle = o.type==='phil' ? RED : BLUE;
      ctx.beginPath(); ctx.arc(o.x,o.y,rr,0,7); ctx.fill();
      if(o===picked){
        ctx.strokeStyle=INK; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(o.x,o.y,rr+5,0,7); ctx.stroke();
      } else {
        ctx.strokeStyle='#fff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(o.x,o.y,rr,0,7); ctx.stroke();
      }
      ctx.fillStyle=INK;
      ctx.fillText(o.label, o.x, o.y-rr-6);
    }
    ctx.textAlign='left';

    if(!started){
      overlay('BRIDGE THE GAP','click anywhere to start');
    } else if(!running){
      overlay(`${score} BRIDGES BUILT`, 'click anywhere to play again');
    }
  }

  function overlay(big, small){
    ctx.fillStyle='rgba(250,250,247,0.88)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle=INK;
    ctx.font='800 28px "Archivo", sans-serif';
    ctx.fillText(big, W/2, H/2-8);
    ctx.font='400 12px "IBM Plex Mono", monospace';
    ctx.fillStyle='#5c5c66';
    ctx.fillText(small, W/2, H/2+20);
    ctx.textAlign='left';
  }

  (function loop(){ step(); draw(); requestAnimationFrame(loop); })();
})();

/* reveal on scroll */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
